<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Cripteando</title>
<script>
// GitHub Pages no conoce rutas como /cripteando/APRENDER: vuelve a la app y le pasa la ruta.
(function(l){var seg=l.pathname.split('/'),gh=/\.github\.io$/.test(l.hostname),
  base=gh?'/'+seg[1]+'/':'/',rest=seg.slice(gh?2:1).join('/');
  l.replace(base+(rest?'?r='+encodeURIComponent(rest):'')+l.hash)})(location);
</script>
</head>
<body></body>
</html>
